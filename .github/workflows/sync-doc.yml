name: Sync Google Doc

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-doc
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull content from the Google Doc
        run: python3 scripts/sync_doc.py
      - name: Commit if anything changed
        run: |
          git config user.name "doc-sync"
          git config user.email "doc-sync@users.noreply.github.com"
          git add content.json images
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Sync content from Google Doc"
            git push
          fi
