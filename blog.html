<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog — Bhakti Assar</title>
  <meta name="description" content="Bhakti Assar's blog" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root{
      --parchment: #e4d3ad;
      --parchment-dark: #c9b385;
      --paper: #f8f0dc;
      --ink: #3b2f22;
      --ink-soft: #6d5b45;
      --accent: #9c4a2f;
      --tape: rgba(214, 190, 130, .75);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--parchment);overflow-x:hidden}
    body{
      margin:0;
      min-height:100vh;
      max-width:100vw;
      padding:28px 16px 60px;
      color:var(--ink);
      font-family:"Kalam", "Comic Sans MS", cursive;
      font-weight:300;
      background-color:var(--parchment);
      background-image:
        radial-gradient(ellipse at center, rgba(255,248,225,.55) 0%, rgba(0,0,0,0) 55%),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(110,80,35,.45) 100%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-attachment:fixed;
    }

    /* ---------- the cut-out page ---------- */
    .page-shadow{
      max-width:1180px;
      margin:0 auto;
      filter:drop-shadow(3px 6px 6px rgba(70,45,15,.35)) drop-shadow(0 18px 24px rgba(70,45,15,.25));
    }
    .page{
      background:
        repeating-linear-gradient(0deg, rgba(150,120,70,.05) 0 1px, transparent 1px 34px),
        var(--paper);
      position:relative;padding:72px 84px 80px;
      /* scissor-cut edge */
      clip-path:polygon(
        0.1% 0.12%, 8% 0.02%, 17% 0.15%, 27% 0.03%, 38% 0.13%, 49% 0.02%, 60% 0.14%, 71% 0.03%, 82% 0.13%, 92% 0.02%, 99.9% 0.1%,
        99.75% 12%, 99.95% 26%, 99.7% 41%, 99.95% 57%, 99.75% 72%, 99.95% 88%, 99.8% 99.88%,
        90% 99.98%, 79% 99.86%, 67% 99.97%, 55% 99.87%, 43% 99.98%, 31% 99.86%, 19% 99.97%, 8% 99.88%, 0.1% 99.95%,
        0.2% 88%, 0.02% 72%, 0.25% 57%, 0.03% 41%, 0.22% 26%, 0.02% 12%
      );
    }

    /* ---------- stitched edge ---------- */
    .stitches{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

    /* ---------- header ---------- */
    header{display:flex;gap:32px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
    .title-box{flex:1 1 420px;min-width:0}
    .avatar{
      position:relative;flex:none;width:210px;margin:10px 20px 0 0;padding:10px 10px 34px;background:#fff;
      transform:rotate(3deg);box-shadow:1px 3px 8px rgba(60,40,10,.3);
    }
    .avatar img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.15)}
    .avatar::before, .note::before{
      content:"";position:absolute;top:-12px;left:50%;width:70px;height:24px;
      transform:translateX(-50%) rotate(-3deg);background:var(--tape);
      box-shadow:0 1px 2px rgba(0,0,0,.12);
    }
    h1{
      margin:0;font-family:"Special Elite", "Courier New", monospace;font-weight:400;
      font-size:clamp(34px, 7vw, 58px);letter-spacing:.06em;line-height:1.05;
    }
    .subtitle{margin:10px 0 0;font-family:"Caveat", cursive;font-size:30px;color:var(--accent)}
    .intro{margin:20px 0 0;font-size:18px;line-height:1.7;overflow-wrap:anywhere}
    .intro p{margin:0 0 8px}

    /* ---------- interest sections ---------- */
    section{margin-top:52px}
    h2{
      display:inline-block;margin:0 0 6px;padding:6px 18px 4px;
      font-family:"Special Elite", "Courier New", monospace;font-weight:400;font-size:24px;
      letter-spacing:.08em;text-transform:lowercase;
      background:var(--ink);color:var(--paper);transform:rotate(-1.2deg);
    }
    section:nth-of-type(even) h2{transform:rotate(.9deg);background:var(--accent)}
    section.sub{margin-top:38px}
    section.sub h2{
      background:none;color:var(--accent);padding:0;transform:none;
      font-family:"Caveat", cursive;font-weight:700;font-size:40px;letter-spacing:0;
      text-decoration:underline wavy rgba(156,74,47,.45);text-underline-offset:6px;
    }
    .blurb{margin:12px 0 0;font-size:18px;line-height:1.75;overflow-wrap:anywhere}
    .blurb a, .intro a, .links a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}

    /* ---------- bullet / numbered lists, straight from the doc ---------- */
    .blist{margin:12px 0 0;padding-left:1.6em}
    .blist li{margin:0 0 .7em;font-size:18px;line-height:1.75;overflow-wrap:anywhere}
    ul.blist{list-style:none}
    ul.blist > li{position:relative}
    ul.blist > li::before{content:"";position:absolute;left:-1.15em;top:.78em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
    ol.blist > li::marker{color:var(--accent);font-weight:700}
    .blist strong{color:var(--accent)}

    /* ---------- timeline of sub-headings, built from the doc's headings ---------- */
    .layout{margin-top:8px}
    .layout.has-timeline{display:grid;grid-template-columns:190px minmax(0, 1fr);gap:0 40px;align-items:start}
    .main{min-width:0}
    .main section{scroll-margin-top:22px}
    .timeline{position:sticky;top:22px;align-self:start;margin-top:52px}
    .timeline ol{list-style:none;margin:0;padding:0;position:relative}
    .timeline ol::before{content:"";position:absolute;left:7px;top:12px;bottom:18px;width:2px;background:rgba(109,91,69,.35)}
    .timeline li{position:relative;padding:0 0 14px 28px}
    .timeline li::before{
      content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;
      background:var(--paper);border:3px solid var(--ink-soft);transition:background .2s, border-color .2s, transform .2s;
    }
    .timeline li.active::before{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
    .timeline a{
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      font-family:"Caveat", cursive;font-size:22px;line-height:1.2;color:var(--ink-soft);text-decoration:none;
    }
    .timeline a:hover{color:var(--ink)}
    .timeline li.active a{color:var(--accent);font-weight:700}

    /* ---------- pictures & videos: plain rectangles, click to enlarge ---------- */
    .gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:22px 0 10px}
    .shot{margin:0;flex:0 1 280px;min-width:0;max-width:100%}
    .gallery .shot:only-child{flex-basis:340px}
    .frame{
      position:relative;display:block;width:100%;aspect-ratio:4/3;padding:0;border:0;margin:0;
      background:#2b2118;cursor:zoom-in;overflow:hidden;border-radius:4px;
      box-shadow:0 2px 8px rgba(60,40,10,.3);
    }
    .frame img, .frame video{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease;pointer-events:none}
    .frame:hover img, .frame:hover video{transform:scale(1.04)}
    .frame:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .frame .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .frame .play::before{
      content:"\25B6";display:flex;align-items:center;justify-content:center;padding-left:4px;
      width:58px;height:58px;border-radius:50%;background:rgba(20,14,8,.65);color:#fffdf5;font-size:22px;
      box-shadow:0 0 0 3px rgba(255,253,245,.8);
    }
    .shot figcaption{margin-top:6px;text-align:center;font-family:"Caveat", cursive;font-size:22px;line-height:1.2;color:var(--ink-soft);overflow-wrap:anywhere}

    /* ---------- enlarged view ---------- */
    .lb{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:12px;padding:56px 12px 20px;background:rgba(20,14,8,.93)}
    .lb[hidden]{display:none}
    .lb-stage{display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
    .lb-stage video{display:block;max-width:94vw;max-height:80vh;width:auto;height:auto;border-radius:3px;background:#000}
    .lb-stage img{display:block;max-width:94vw;max-height:80vh;width:auto;height:auto;border-radius:3px}
    .lb-stage iframe{display:block;border:0;width:min(94vw, 1100px);aspect-ratio:16/9;max-height:80vh;border-radius:3px;background:#000}
    .lb-cap{max-width:90vw;text-align:center;color:#f3e8cf;font-family:"Caveat", cursive;font-size:24px;min-height:1em}
    .lb button{
      position:absolute;border:0;background:rgba(255,253,245,.14);color:#fffdf5;cursor:pointer;
      width:46px;height:46px;border-radius:50%;font-size:28px;line-height:1;
    }
    .lb button:hover{background:rgba(255,253,245,.3)}
    .lb-x{top:10px;right:10px}
    .lb-prev{left:10px;top:50%;transform:translateY(-50%)}
    .lb-next{right:10px;top:50%;transform:translateY(-50%)}

    /* ---------- links ---------- */
    .links{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;font-size:19px;max-width:100%}
    .links p{margin:0;overflow-wrap:anywhere;max-width:100%}

    /* ---------- contact / blog, right under the name ---------- */
    .find-me-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;margin:14px 0 2px}
    .contact-toggle, .blog-link{
      font-family:"Caveat", cursive;font-weight:700;font-size:21px;color:var(--accent);
      background:none;border:none;padding:2px 2px;cursor:pointer;
      text-decoration:underline wavy rgba(156,74,47,.45);text-underline-offset:4px;
    }
    .contact-toggle:hover, .blog-link:hover{color:var(--ink)}
    .contact-panel{
      display:flex;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 0;
      margin:8px 0 0;font-family:"Kalam","Comic Sans MS",cursive;font-size:18px;
      max-width:100%;overflow-wrap:anywhere;
    }
    .contact-panel[hidden]{display:none}
    .contact-panel p{margin:0}
    .contact-panel p + p::before{content:"|";margin:0 12px;color:var(--ink-soft)}
    .contact-panel a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}

    .status{text-align:center;font-family:"Caveat", cursive;font-size:26px;color:var(--ink-soft);padding:30px 0}
    footer{margin-top:60px;text-align:center;font-family:"Caveat", cursive;font-size:20px;color:var(--ink-soft)}

    @media (max-width:640px){
      body{padding:14px 8px 40px}
      .layout.has-timeline{display:block}
      .timeline{position:sticky;top:0;z-index:6;margin:14px -6px 0;padding:8px 6px 4px;background:var(--paper);border-bottom:1px dashed rgba(109,91,69,.4)}
      .timeline ol{display:flex;gap:4px 18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
      .timeline ol::-webkit-scrollbar{display:none}
      .timeline ol::before{display:none}
      .timeline li{flex:none;padding:0 0 4px 22px}
      .timeline li::before{top:5px;width:13px;height:13px;border-width:2.5px}
      .timeline a{display:block;-webkit-line-clamp:unset;white-space:nowrap}
      .main section{scroll-margin-top:64px}
      .page{padding:44px 30px 48px}
      .avatar{width:150px;margin:6px auto 0 0}
      header{gap:24px}
      .blurb{font-size:17px}
      .gallery{gap:12px}
      .shot{flex-basis:calc(50% - 6px)}
      .gallery .shot:only-child{flex-basis:min(100%, 300px)}
      .lb-prev,.lb-next{top:auto;bottom:14px;transform:none}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="page-shadow">
    <main class="page" id="page">
      <svg class="stitches" id="stitches" aria-hidden="true"></svg>
      <div id="content"><p class="status" id="status">unrolling the parchment…</p></div>
    </main>
  </div>
  <footer id="footer"></footer>

  <script>
    // Everything on this page comes from blog.json, which is synced from a Google Doc
    // by .github/workflows/sync-doc.yml. Edit the doc, not this file.
    const page = document.getElementById("content");

    function el(tag, className, text){
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function safeUrl(url){
      try {
        const u = new URL(url, location.href);
        return ["http:", "https:", "mailto:"].includes(u.protocol) ? u.href : null;
      } catch { return null; }
    }

    function renderRuns(parent, runs){
      for (const r of runs || []){
        let node = document.createTextNode(r.text);
        const href = r.href && safeUrl(r.href);
        if (href){
          const a = el("a");
          a.href = href;
          if (!href.startsWith("mailto:")){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
          a.appendChild(node);
          node = a;
        }
        if (r.i){ const i = el("em"); i.appendChild(node); node = i; }
        if (r.b){ const b = el("strong"); b.appendChild(node); node = b; }
        parent.appendChild(node);
      }
    }

    // Never show a picture's file name: drop anything up to and including ".jpg"/".png"/... and any stray "name.ext" token.
    function cleanCaption(c){
      return (c || "")
        .replace(/\b(?:WhatsApp (?:Image|Video)|Screenshot|IMG|DSC|DSCN|PXL|VID|PHOTO|Photo|image)[\w\-. ()]*?\.(?:jpe?g|png|gif|webp|avif|heic)\b/gi, "")
        .replace(/^.*?\.(?:jpe?g|png|gif|webp|avif|heic)\b(?=[\s:;\-–—·]+\S)[\s:;\-–—·]*/i, "")
        .replace(/\S+\.(?:jpe?g|png|gif|webp|avif|heic)\b/gi, "")
        .replace(/\s+/g, " ")
        .replace(/^[\s:;\-–—·]+/, "")
        .trim();
    }

    // every picture/video on the page, in order, so the enlarged view can step through them
    const media = [];

    function driveThumb(id){ return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w800"; }

    // play a tile's video only while it's on screen (saves battery/data); respects "reduce motion"
    const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const io = ("IntersectionObserver" in window) ? new IntersectionObserver(entries => {
      for (const e of entries){
        if (e.isIntersecting){ const p = e.target.play(); if (p && p.catch) p.catch(() => {}); }
        else e.target.pause();
      }
    }, { threshold: 0.25 }) : null;
    function autoplayWhenVisible(v){
      if (reduceMotion) return;
      if (io) io.observe(v); else { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    }

    function renderShot(b){
      const caption = cleanCaption(b.caption);
      const fig = el("figure", "shot");
      const frame = el("button", "frame");
      frame.type = "button";
      frame.setAttribute("aria-label", (b.video ? "play video" : "enlarge picture") + (caption ? ": " + caption : ""));
      const item = { caption, video: !!b.video, src: b.src && safeUrl(b.src), drive: b.drive,
                     vsrc: b.vsrc && safeUrl(b.vsrc), poster: b.poster && safeUrl(b.poster) };
      if (item.video && item.vsrc){
        // a video that was downloaded into the site: plays by itself, muted and looping like a GIF
        // (browsers only allow autoplay when muted). Click it for the big view with sound + controls.
        const v = el("video");
        v.src = item.vsrc; if (item.poster) v.poster = item.poster;
        v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
        v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.preload = "metadata";
        frame.appendChild(v);
        autoplayWhenVisible(v);
      } else if (item.video){
        // too big to download: Drive's own embedded player in the big view, never a link out.
        // The poster is Drive's thumbnail if the viewer's browser can load it, else a dark rectangle.
        if (item.drive){
          const img = el("img"); img.src = driveThumb(item.drive); img.alt = ""; img.loading = "lazy";
          img.onerror = () => img.remove();
          frame.appendChild(img);
        }
        frame.appendChild(el("span", "play"));
      } else if (item.src){
        const img = el("img"); img.src = item.src; img.alt = caption; img.loading = "lazy"; img.decoding = "async";
        frame.appendChild(img);
      } else {
        return null;
      }
      const idx = media.push(item) - 1;
      frame.addEventListener("click", () => openViewer(idx));
      fig.appendChild(frame);
      if (caption) fig.appendChild(el("figcaption", null, caption));
      return fig;
    }

    // text and media stay in the order they're written in the doc; runs of consecutive
    // pictures/videos sit together in one tidy grid.
    function renderSection(s){
      const sec = el("section", s.level === 2 ? "sub" : null);
      sec.appendChild(el("h2", null, s.title));
      let gallery = null, list = null;
      for (const b of s.blocks){
        if (b.type === "note"){
          list = null;
          const shot = renderShot(b);
          if (!shot) continue;
          if (!gallery){ gallery = el("div", "gallery"); sec.appendChild(gallery); }
          gallery.appendChild(shot);
        } else if (b.list){
          // a bulleted / numbered item, exactly as it's formatted in the doc
          gallery = null;
          const kind = b.list === "ol" ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== kind){ list = el(kind, "blist"); sec.appendChild(list); }
          const li = el("li");
          if (b.level) li.style.marginLeft = (b.level * 1.4) + "em";
          renderRuns(li, b.runs);
          list.appendChild(li);
        } else {
          gallery = null; list = null;
          const p = el("p", "blurb");
          renderRuns(p, b.runs);
          sec.appendChild(p);
        }
      }
      return sec;
    }

    // A side timeline of the doc's sub-headings (or its headings, if there are no sub-headings).
    // Nothing to maintain: add or rename a heading in the doc and the timeline follows.
    function buildTimeline(entries, secEls){
      const nav = el("nav", "timeline");
      nav.setAttribute("aria-label", "sections");
      const ol = el("ol");
      const items = entries.map(s => {
        const li = el("li");
        const a = el("a", null, s.title);
        a.href = "#" + secEls.get(s).id; a.title = s.title;
        li.appendChild(a); ol.appendChild(li);
        return { li, sec: secEls.get(s) };
      });
      nav.appendChild(ol);
      let ticking = false;
      const update = () => {
        ticking = false;
        let cur = 0;
        const line = innerHeight * 0.35;
        items.forEach((it, i) => { if (it.sec.getBoundingClientRect().top <= line) cur = i; });
        if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = items.length - 1;
        items.forEach((it, i) => it.li.classList.toggle("active", i === cur));
        // on phones the timeline is a sideways strip: keep the current dot in view
        const act = items[cur].li;
        if (ol.scrollWidth > ol.clientWidth) ol.scrollTo({ left: act.offsetLeft - 16, behavior: "smooth" });
      };
      const onScroll = () => { if (!ticking){ ticking = true; requestAnimationFrame(update); } };
      addEventListener("scroll", onScroll, { passive: true });
      addEventListener("resize", onScroll);
      update();
      return nav;
    }

    // ---------- enlarged view ----------
    const lb = el("div", "lb");
    lb.hidden = true;
    lb.setAttribute("role", "dialog");
    lb.setAttribute("aria-modal", "true");
    const lbStage = el("div", "lb-stage");
    const lbCap = el("div", "lb-cap");
    const lbX = el("button", "lb-x", "\u00D7"); lbX.type = "button"; lbX.setAttribute("aria-label", "close");
    const lbPrev = el("button", "lb-prev", "\u2039"); lbPrev.type = "button"; lbPrev.setAttribute("aria-label", "previous");
    const lbNext = el("button", "lb-next", "\u203A"); lbNext.type = "button"; lbNext.setAttribute("aria-label", "next");
    lb.append(lbX, lbPrev, lbStage, lbCap, lbNext);
    document.body.appendChild(lb);
    let lbIndex = -1, lastFocus = null;

    function showViewer(i){
      lbIndex = (i + media.length) % media.length;
      const m = media[lbIndex];
      lbStage.textContent = "";                       // also stops a playing video
      if (m.video && m.vsrc){
        const v = el("video");
        v.src = m.vsrc; if (m.poster) v.poster = m.poster;
        v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
        lbStage.appendChild(v);
        const p = v.play(); if (p && p.catch) p.catch(() => {});
      } else if (m.video){
        const f = el("iframe");
        f.src = "https://drive.google.com/file/d/" + encodeURIComponent(m.drive) + "/preview";
        f.allow = "autoplay; fullscreen";
        f.allowFullscreen = true;
        f.title = m.caption || "video";
        lbStage.appendChild(f);
      } else {
        const img = el("img"); img.src = m.src; img.alt = m.caption || "";
        lbStage.appendChild(img);
      }
      lbCap.textContent = m.caption || "";
      const many = media.length > 1;
      lbPrev.hidden = lbNext.hidden = !many;
    }
    function openViewer(i){
      lastFocus = document.activeElement;
      lb.hidden = false;
      document.body.style.overflow = "hidden";
      showViewer(i);
      lbX.focus();
    }
    function closeViewer(){
      lb.hidden = true;
      lbStage.textContent = "";
      document.body.style.overflow = "";
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    lbX.addEventListener("click", closeViewer);
    lbPrev.addEventListener("click", () => showViewer(lbIndex - 1));
    lbNext.addEventListener("click", () => showViewer(lbIndex + 1));
    lb.addEventListener("click", e => { if (e.target === lb || e.target === lbStage) closeViewer(); });
    document.addEventListener("keydown", e => {
      if (lb.hidden) return;
      if (e.key === "Escape") closeViewer();
      else if (e.key === "ArrowLeft" && media.length > 1) showViewer(lbIndex - 1);
      else if (e.key === "ArrowRight" && media.length > 1) showViewer(lbIndex + 1);
    });

    // this page is the blog, synced from the doc's second tab into blog.json by
    // the same workflow that builds content.json. See index.html for the home page.
    const NAV_LABEL = "🏠 home";
    const NAV_URL = "index.html";

    function render(data){
      page.textContent = "";
      media.length = 0;
      const header = el("header");
      const titleBox = el("div", "title-box");
      titleBox.appendChild(el("h1", null, data.title || "Blog"));
      if (data.subtitle) titleBox.appendChild(el("p", "subtitle", data.subtitle));

      // a section named "find me" / "links" / "contact" / "elsewhere" doesn't render
      // as a scroll-down section like the others — it becomes a click-to-reveal
      // row right under the name, alongside a static link to the blog.
      const sections = (data.sections || []).slice();
      const linksIdx = sections.findIndex(s => /^(find me|links|contact|elsewhere)$/i.test((s.title || "").trim()));
      const linksSection = linksIdx !== -1 ? sections.splice(linksIdx, 1)[0] : null;

      const findMeRow = el("div", "find-me-row");
      if (linksSection){
        const toggle = el("button", "contact-toggle", "✉ " + (linksSection.title || "contact"));
        toggle.type = "button";
        toggle.setAttribute("aria-expanded", "false");
        const panel = el("div", "contact-panel");
        panel.hidden = true;
        for (const b of linksSection.blocks){
          if (b.type !== "p") continue;
          const p = el("p");
          renderRuns(p, b.runs);
          panel.appendChild(p);
        }
        toggle.addEventListener("click", () => {
          const show = panel.hidden;
          panel.hidden = !show;
          toggle.setAttribute("aria-expanded", show ? "true" : "false");
        });
        findMeRow.appendChild(toggle);
        findMeRow.appendChild(panel);
      }
      const nav = el("a", "blog-link", NAV_LABEL);
      nav.href = NAV_URL;
      findMeRow.appendChild(nav);
      titleBox.appendChild(findMeRow);

      if (data.intro && data.intro.length){
        const intro = el("div", "intro");
        for (const runs of data.intro){ const p = el("p"); renderRuns(p, runs); intro.appendChild(p); }
        titleBox.appendChild(intro);
      }
      header.appendChild(titleBox);
      // the profile photo comes from the Google Doc (a picture or pic link above the first heading)
      if (data.avatar && data.avatar.src && safeUrl(data.avatar.src)){
        const av = el("div", "avatar");
        const img = el("img");
        img.src = safeUrl(data.avatar.src); img.alt = data.avatar.alt || "Bhakti";
        img.onerror = () => av.remove();
        av.appendChild(img);
        header.appendChild(av);
      }
      page.appendChild(header);
      const layout = el("div", "layout");
      const main = el("div", "main");
      const secEls = new Map();
      sections.forEach((s, i) => { const e = renderSection(s); e.id = "sec-" + (i + 1); secEls.set(s, e); main.appendChild(e); });
      const subs = sections.filter(s => s.level === 2);
      const entries = subs.length ? subs : sections;
      if (entries.length >= 2){
        layout.classList.add("has-timeline");
        layout.appendChild(buildTimeline(entries, secEls));
      }
      layout.appendChild(main);
      page.appendChild(layout);
      document.title = (data.title || "Blog").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }


    // Cross-stitch border in olive thread: every X is two crossing threads, a touch uneven like hand work.
    function sewStitches(){
      const svg = document.getElementById("stitches");
      const host = svg.parentElement;
      const W = host.clientWidth, H = host.clientHeight, inset = W < 640 ? 15 : 26, step = W < 640 ? 22 : 25;
      let seed = 5;
      const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const between = (a, b) => a + rnd() * (b - a);
      const f = n => n.toFixed(1);
      const THREAD = "#4b5a35", EDGE = "#2f3a20", LIGHT = "#8a9a62";
      const out = [];
      const thread = (ax, ay, bx, by, w) => {
        out.push(`<line x1="${f(ax + .8)}" y1="${f(ay + 1.6)}" x2="${f(bx + .8)}" y2="${f(by + 1.6)}" stroke="rgba(40,28,8,.28)" stroke-width="${f(w + .8)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${EDGE}" stroke-width="${f(w + .6)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${THREAD}" stroke-width="${f(w)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${LIGHT}" stroke-width="1" stroke-linecap="round" opacity=".55" transform="translate(-.5,-.6)"/>`);
      };
      const cross = (cx, cy) => {
        const r = between(6.2, 7.8), j = () => between(-1.4, 1.4), w = between(3, 3.8);
        thread(cx - r + j(), cy - r + j(), cx + r + j(), cy + r + j(), w);   // first thread
        thread(cx + r + j(), cy - r + j(), cx - r + j(), cy + r + j(), w);   // second thread, over the first
      };
      const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
      const nx = Math.max(2, Math.round((x1 - x0) / step)), ny = Math.max(2, Math.round((y1 - y0) / step));
      for (let i = 0; i <= nx; i++){ const x = x0 + (x1 - x0) * i / nx; cross(x, y0 + between(-1, 1)); cross(x, y1 + between(-1, 1)); }
      for (let i = 1; i < ny; i++){ const y = y0 + (y1 - y0) * i / ny; cross(x0 + between(-1, 1), y); cross(x1 + between(-1, 1), y); }
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.innerHTML = out.join("");
    }
    // Hand-cut paper edge: the scissors wander, drift in and out, and change angle now and then.
    function cutPaper(){
      const host = document.getElementById("page");
      const W = host.clientWidth, H = host.clientHeight, MAX = 15;
      let seed = 23;
      const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const between = (a, b) => a + rnd() * (b - a);
      const pts = [];
      const side = (len, place) => {
        let d = between(2, MAX - 2), t = 0;
        while (true){
          t += between(26, 120);
          if (t > len - 20) break;
          d = rnd() < .18 ? between(0, MAX) : Math.max(0, Math.min(MAX, d + between(-5, 5)));
          pts.push(place(t, d));
          if (rnd() < .22) pts.push(place(t + between(6, 16), Math.max(0, Math.min(MAX, d + between(-4, 4)))));  // little jog
        }
      };
      pts.push([between(0, 10), between(0, 12)]);                       // top-left corner
      side(W, (t, d) => [t, d]);
      pts.push([W - between(0, 10), between(0, 12)]);                   // top-right
      side(H, (t, d) => [W - d, t]);
      pts.push([W - between(0, 10), H - between(0, 12)]);               // bottom-right
      side(W, (t, d) => [W - t, H - d]);
      pts.push([between(0, 10), H - between(0, 12)]);                   // bottom-left
      side(H, (t, d) => [d, H - t]);
      host.style.clipPath = "polygon(" + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(", ") + ")";
    }
    const pageEl = document.getElementById("page");
    let sewTimer;
    new ResizeObserver(() => { clearTimeout(sewTimer); sewTimer = setTimeout(() => { cutPaper(); sewStitches(); }, 60); }).observe(pageEl);

    fetch("blog.json?v=" + Date.now())
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => { document.getElementById("status").textContent = "the page got lost in the post — try refreshing"; });
  </script>
</body>
</html>
