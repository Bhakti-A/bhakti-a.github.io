<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bhakti Assar</title>
  <meta name="description" content="Personal site for Bhakti Assar" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root{
      --parchment: #e4d3ad;
      --parchment-dark: #c9b385;
      --paper: #f8f0dc;
      --ink: #3b2f22;
      --ink-soft: #6d5b45;
      --accent: #9c4a2f;
      --tape: rgba(214, 190, 130, .75);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--parchment)}
    body{
      margin:0;
      min-height:100vh;
      padding:48px 20px 80px;
      color:var(--ink);
      font-family:"Kalam", "Comic Sans MS", cursive;
      font-weight:300;
      background-color:var(--parchment);
      background-image:
        radial-gradient(ellipse at center, rgba(255,248,225,.55) 0%, rgba(0,0,0,0) 55%),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(110,80,35,.45) 100%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-attachment:fixed;
    }

    /* ---------- the cut-out page ---------- */
    .page-shadow{
      max-width:900px;
      margin:0 auto;
      filter:drop-shadow(3px 6px 6px rgba(70,45,15,.35)) drop-shadow(0 18px 24px rgba(70,45,15,.25));
      transform:rotate(-.6deg);
    }
    .page{
      background:
        repeating-linear-gradient(0deg, rgba(150,120,70,.05) 0 1px, transparent 1px 34px),
        var(--paper);
      padding:56px 52px 64px;
      /* scissor-cut edge */
      clip-path:polygon(
        0.4% 1.2%, 6% 0.3%, 13% 1.1%, 21% 0.2%, 30% 0.9%, 38% 0.1%, 47% 1%, 56% 0.3%, 65% 1.2%, 74% 0.2%, 83% 0.9%, 92% 0.1%, 99.6% 0.8%,
        99.9% 8%, 99.2% 17%, 100% 27%, 99.3% 38%, 99.9% 49%, 99.1% 60%, 100% 71%, 99.4% 82%, 99.9% 92%, 99.5% 99.3%,
        92% 99.9%, 83% 99%, 74% 99.9%, 64% 99.2%, 55% 100%, 46% 99.1%, 37% 99.9%, 28% 99.2%, 19% 100%, 10% 99.1%, 0.5% 99.7%,
        0.1% 91%, 0.8% 81%, 0% 70%, 0.7% 59%, 0.1% 47%, 0.9% 36%, 0.1% 25%, 0.8% 14%
      );
    }

    /* ---------- header ---------- */
    header{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .avatar{
      position:relative;flex:none;width:150px;padding:8px 8px 26px;background:#fff;
      transform:rotate(-4deg);box-shadow:1px 3px 8px rgba(60,40,10,.3);
    }
    .avatar img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.15)}
    .avatar::before, .note::before{
      content:"";position:absolute;top:-12px;left:50%;width:70px;height:24px;
      transform:translateX(-50%) rotate(-3deg);background:var(--tape);
      box-shadow:0 1px 2px rgba(0,0,0,.12);
    }
    h1{
      margin:0;font-family:"Special Elite", "Courier New", monospace;font-weight:400;
      font-size:clamp(34px, 7vw, 58px);letter-spacing:.06em;line-height:1.05;
    }
    .subtitle{margin:10px 0 0;font-family:"Caveat", cursive;font-size:30px;color:var(--accent)}
    .intro{margin:20px 0 0;font-size:18px;line-height:1.7;max-width:60ch}
    .intro p{margin:0 0 8px}

    /* ---------- interest sections ---------- */
    section{margin-top:52px}
    h2{
      display:inline-block;margin:0 0 6px;padding:6px 18px 4px;
      font-family:"Special Elite", "Courier New", monospace;font-weight:400;font-size:24px;
      letter-spacing:.08em;text-transform:lowercase;
      background:var(--ink);color:var(--paper);transform:rotate(-1.2deg);
    }
    section:nth-of-type(even) h2{transform:rotate(.9deg);background:var(--accent)}
    section.sub{margin-top:38px}
    section.sub h2{
      background:none;color:var(--accent);padding:0;transform:none;
      font-family:"Caveat", cursive;font-weight:700;font-size:40px;letter-spacing:0;
      text-decoration:underline wavy rgba(156,74,47,.45);text-underline-offset:6px;
    }
    .blurb{margin:10px 0 0;font-size:17px;line-height:1.7;max-width:62ch}
    .blurb a, .intro a, .links a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}

    .notes{display:flex;flex-wrap:wrap;gap:34px 30px;margin-top:26px;padding:6px 4px}
    .note{
      position:relative;width:210px;padding:14px 14px 18px;
      font-family:"Caveat", cursive;font-weight:500;font-size:24px;line-height:1.15;text-align:center;
      box-shadow:2px 5px 9px rgba(60,40,10,.28);
      transition:transform .2s ease, box-shadow .2s ease;
      background:#f7e27a;
    }
    .note:nth-child(4n+1){background:#f7e27a;transform:rotate(-3deg)}
    .note:nth-child(4n+2){background:#f4b6c2;transform:rotate(2.5deg) translateY(8px)}
    .note:nth-child(4n+3){background:#b9dfb4;transform:rotate(-1.5deg)}
    .note:nth-child(4n+4){background:#aed3e6;transform:rotate(3deg) translateY(6px)}
    .note:hover{transform:rotate(0) scale(1.05);z-index:2;box-shadow:4px 10px 16px rgba(60,40,10,.35)}
    .note img, .note .ph{
      display:block;width:100%;aspect-ratio:1;object-fit:cover;margin-bottom:10px;
      border:5px solid #fffdf5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    }
    .note .ph{
      display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.45);
      border:2px dashed rgba(60,40,10,.35);font-size:18px;color:var(--ink-soft);
    }

    /* ---------- links ---------- */
    .links{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;font-size:19px}
    .links p{margin:0}

    .status{text-align:center;font-family:"Caveat", cursive;font-size:26px;color:var(--ink-soft);padding:30px 0}
    footer{margin-top:60px;text-align:center;font-family:"Caveat", cursive;font-size:20px;color:var(--ink-soft)}

    @media (max-width:640px){
      body{padding:24px 10px 60px}
      .page{padding:40px 24px 48px}
      header{gap:24px}
      .note{width:calc(50% - 15px);font-size:21px;padding:10px 10px 14px}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="page-shadow">
    <main class="page" id="page">
      <p class="status" id="status">unrolling the parchment…</p>
    </main>
  </div>
  <footer id="footer"></footer>

  <script>
    // Everything on this page comes from content.json, which is synced from a Google Doc
    // by .github/workflows/sync-doc.yml. Edit the doc, not this file.
    const page = document.getElementById("page");

    function el(tag, className, text){
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function safeUrl(url){
      try {
        const u = new URL(url, location.href);
        return ["http:", "https:", "mailto:"].includes(u.protocol) ? u.href : null;
      } catch { return null; }
    }

    function renderRuns(parent, runs){
      for (const r of runs || []){
        let node = document.createTextNode(r.text);
        const href = r.href && safeUrl(r.href);
        if (href){
          const a = el("a");
          a.href = href;
          if (!href.startsWith("mailto:")){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
          a.appendChild(node);
          node = a;
        }
        if (r.i){ const i = el("em"); i.appendChild(node); node = i; }
        if (r.b){ const b = el("strong"); b.appendChild(node); node = b; }
        parent.appendChild(node);
      }
    }

    function renderNote(b){
      const note = el("figure", "note");
      const src = b.src && safeUrl(b.src);
      if (src){
        const img = el("img");
        img.src = src; img.alt = b.alt || b.caption || ""; img.loading = "lazy";
        note.appendChild(img);
      } else {
        note.appendChild(el("div", "ph", "photo goes here"));
      }
      if (b.caption) note.appendChild(el("figcaption", null, b.caption));
      return note;
    }

    function renderSection(s){
      const sec = el("section", s.level === 2 ? "sub" : null);
      sec.appendChild(el("h2", null, s.title));
      const isLinks = /^(find me|links|contact|elsewhere)$/i.test(s.title.trim());
      let notes = null;
      for (const b of s.blocks){
        if (b.type === "note"){
          if (!notes){ notes = el("div", "notes"); sec.appendChild(notes); }
          notes.appendChild(renderNote(b));
        } else {
          notes = null;
        }
      }
      // paragraphs first (blurb / links), then post-its in document order
      const textHost = isLinks ? el("div", "links") : null;
      const frag = document.createDocumentFragment();
      for (const b of s.blocks){
        if (b.type !== "p") continue;
        const p = el("p", isLinks ? null : "blurb");
        renderRuns(p, b.runs);
        (textHost || frag).appendChild(p);
      }
      sec.insertBefore(textHost || frag, sec.children[1] || null);
      return sec;
    }

    function render(data){
      page.textContent = "";
      const header = el("header");
      if (data.avatar && data.avatar.src && safeUrl(data.avatar.src)){
        const av = el("div", "avatar");
        const img = el("img");
        img.src = safeUrl(data.avatar.src); img.alt = data.avatar.alt || "";
        av.appendChild(img);
        header.appendChild(av);
      }
      const titleBox = el("div");
      titleBox.appendChild(el("h1", null, data.title || "Bhakti Assar"));
      if (data.subtitle) titleBox.appendChild(el("p", "subtitle", data.subtitle));
      if (data.intro && data.intro.length){
        const intro = el("div", "intro");
        for (const runs of data.intro){ const p = el("p"); renderRuns(p, runs); intro.appendChild(p); }
        titleBox.appendChild(intro);
      }
      header.appendChild(titleBox);
      page.appendChild(header);
      for (const s of data.sections || []) page.appendChild(renderSection(s));
      document.title = (data.title || "Bhakti Assar").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }

    fetch("content.json?v=" + Date.now())
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => { document.getElementById("status").textContent = "the page got lost in the post — try refreshing"; });
  </script>
</body>
</html>
