<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bhakti Assar</title>
  <meta name="description" content="Personal site for Bhakti Assar" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root{
      --parchment: #e4d3ad;
      --parchment-dark: #c9b385;
      --paper: #f8f0dc;
      --ink: #3b2f22;
      --ink-soft: #6d5b45;
      --accent: #9c4a2f;
      --tape: rgba(214, 190, 130, .75);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--parchment)}
    body{
      margin:0;
      min-height:100vh;
      padding:28px 16px 60px;
      color:var(--ink);
      font-family:"Kalam", "Comic Sans MS", cursive;
      font-weight:300;
      background-color:var(--parchment);
      background-image:
        radial-gradient(ellipse at center, rgba(255,248,225,.55) 0%, rgba(0,0,0,0) 55%),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(110,80,35,.45) 100%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .15  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-attachment:fixed;
    }

    /* ---------- the cut-out page ---------- */
    .page-shadow{
      max-width:1280px;
      margin:0 auto;
      filter:drop-shadow(3px 6px 6px rgba(70,45,15,.35)) drop-shadow(0 18px 24px rgba(70,45,15,.25));
      transform:rotate(-.6deg);
    }
    .page{
      background:
        repeating-linear-gradient(0deg, rgba(150,120,70,.05) 0 1px, transparent 1px 34px),
        var(--paper);
      position:relative;padding:72px 84px 80px;
      /* scissor-cut edge */
      clip-path:polygon(
        0.1% 0.12%, 8% 0.02%, 17% 0.15%, 27% 0.03%, 38% 0.13%, 49% 0.02%, 60% 0.14%, 71% 0.03%, 82% 0.13%, 92% 0.02%, 99.9% 0.1%,
        99.75% 12%, 99.95% 26%, 99.7% 41%, 99.95% 57%, 99.75% 72%, 99.95% 88%, 99.8% 99.88%,
        90% 99.98%, 79% 99.86%, 67% 99.97%, 55% 99.87%, 43% 99.98%, 31% 99.86%, 19% 99.97%, 8% 99.88%, 0.1% 99.95%,
        0.2% 88%, 0.02% 72%, 0.25% 57%, 0.03% 41%, 0.22% 26%, 0.02% 12%
      );
    }

    /* ---------- stitched edge ---------- */
    .stitches{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

    /* ---------- header ---------- */
    header{display:flex;gap:32px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
    .title-box{flex:1 1 420px;min-width:0}
    .avatar{
      position:relative;flex:none;width:210px;margin:10px 20px 0 0;padding:10px 10px 34px;background:#fff;
      transform:rotate(3deg);box-shadow:1px 3px 8px rgba(60,40,10,.3);
    }
    .avatar img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.15)}
    .avatar::before, .note::before{
      content:"";position:absolute;top:-12px;left:50%;width:70px;height:24px;
      transform:translateX(-50%) rotate(-3deg);background:var(--tape);
      box-shadow:0 1px 2px rgba(0,0,0,.12);
    }
    h1{
      margin:0;font-family:"Special Elite", "Courier New", monospace;font-weight:400;
      font-size:clamp(34px, 7vw, 58px);letter-spacing:.06em;line-height:1.05;
    }
    .subtitle{margin:10px 0 0;font-family:"Caveat", cursive;font-size:30px;color:var(--accent)}
    .intro{margin:20px 0 0;font-size:18px;line-height:1.7;max-width:60ch}
    .intro p{margin:0 0 8px}

    /* ---------- interest sections ---------- */
    section{margin-top:52px}
    h2{
      display:inline-block;margin:0 0 6px;padding:6px 18px 4px;
      font-family:"Special Elite", "Courier New", monospace;font-weight:400;font-size:24px;
      letter-spacing:.08em;text-transform:lowercase;
      background:var(--ink);color:var(--paper);transform:rotate(-1.2deg);
    }
    section:nth-of-type(even) h2{transform:rotate(.9deg);background:var(--accent)}
    section.sub{margin-top:38px}
    section.sub h2{
      background:none;color:var(--accent);padding:0;transform:none;
      font-family:"Caveat", cursive;font-weight:700;font-size:40px;letter-spacing:0;
      text-decoration:underline wavy rgba(156,74,47,.45);text-underline-offset:6px;
    }
    .blurb{margin:10px 0 0;font-size:17px;line-height:1.7;max-width:62ch}
    .blurb a, .intro a, .links a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}

    .notes{display:flex;flex-wrap:wrap;gap:34px 30px;margin-top:26px;padding:6px 4px}
    .note{
      position:relative;width:340px;max-width:100%;margin:0;padding:18px 18px 24px;
      font-family:"Caveat", cursive;font-weight:500;font-size:32px;line-height:1.15;text-align:center;
      box-shadow:2px 5px 9px rgba(60,40,10,.28);
      transition:transform .2s ease, box-shadow .2s ease;
      background:#f7e27a;
    }
    .note:nth-child(4n+1){background:#f7e27a;transform:rotate(-3deg)}
    .note:nth-child(4n+2){background:#f4b6c2;transform:rotate(2.5deg) translateY(8px)}
    .note:nth-child(4n+3){background:#b9dfb4;transform:rotate(-1.5deg)}
    .note:nth-child(4n+4){background:#aed3e6;transform:rotate(3deg) translateY(6px)}
    .note:hover{transform:rotate(0) scale(1.05);z-index:2;box-shadow:4px 10px 16px rgba(60,40,10,.35)}
    .note img, .note .ph{
      display:block;width:100%;aspect-ratio:4/5;object-fit:cover;margin-bottom:12px;
      border:5px solid #fffdf5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    }
    .note .ph{
      display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.45);
      border:2px dashed rgba(60,40,10,.35);font-size:18px;color:var(--ink-soft);
    }

    /* ---------- links ---------- */
    .links{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;font-size:19px}
    .links p{margin:0}

    .status{text-align:center;font-family:"Caveat", cursive;font-size:26px;color:var(--ink-soft);padding:30px 0}
    footer{margin-top:60px;text-align:center;font-family:"Caveat", cursive;font-size:20px;color:var(--ink-soft)}

    @media (max-width:640px){
      body{padding:24px 10px 60px}
      .page{padding:58px 48px 62px}
      .avatar{width:150px;margin:6px auto 0 0}
      header{gap:24px}
      .note{width:min(100%, 300px);margin:0 auto;font-size:28px;padding:14px 14px 20px}
      .notes{justify-content:center}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="page-shadow">
    <main class="page" id="page">
      <svg class="stitches" id="stitches" aria-hidden="true"></svg>
      <div id="content"><p class="status" id="status">unrolling the parchment…</p></div>
    </main>
  </div>
  <footer id="footer"></footer>

  <script>
    // Everything on this page comes from content.json, which is synced from a Google Doc
    // by .github/workflows/sync-doc.yml. Edit the doc, not this file.
    const page = document.getElementById("content");

    function el(tag, className, text){
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function safeUrl(url){
      try {
        const u = new URL(url, location.href);
        return ["http:", "https:", "mailto:"].includes(u.protocol) ? u.href : null;
      } catch { return null; }
    }

    function renderRuns(parent, runs){
      for (const r of runs || []){
        let node = document.createTextNode(r.text);
        const href = r.href && safeUrl(r.href);
        if (href){
          const a = el("a");
          a.href = href;
          if (!href.startsWith("mailto:")){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
          a.appendChild(node);
          node = a;
        }
        if (r.i){ const i = el("em"); i.appendChild(node); node = i; }
        if (r.b){ const b = el("strong"); b.appendChild(node); node = b; }
        parent.appendChild(node);
      }
    }

    // Never show a picture's file name: drop anything up to and including ".jpg"/".png"/... and any stray "name.ext" token.
    function cleanCaption(c){
      return (c || "")
        .replace(/\b(?:WhatsApp (?:Image|Video)|Screenshot|IMG|DSC|DSCN|PXL|VID|PHOTO|Photo|image)[\w\-. ()]*?\.(?:jpe?g|png|gif|webp|avif|heic)\b/gi, "")
        .replace(/^.*?\.(?:jpe?g|png|gif|webp|avif|heic)\b(?=[\s:;\-–—·]+\S)[\s:;\-–—·]*/i, "")
        .replace(/\S+\.(?:jpe?g|png|gif|webp|avif|heic)\b/gi, "")
        .replace(/\s+/g, " ")
        .replace(/^[\s:;\-–—·]+/, "")
        .trim();
    }

    function renderNote(b){
      const note = el("figure", "note");
      const caption = cleanCaption(b.caption);
      const src = b.src && safeUrl(b.src);
      if (src){
        const img = el("img");
        img.src = src; img.alt = caption || ""; img.loading = "lazy";
        note.appendChild(img);
      } else {
        note.appendChild(el("div", "ph", "photo goes here"));
      }
      if (caption) note.appendChild(el("figcaption", null, caption));
      return note;
    }

    function renderSection(s){
      const sec = el("section", s.level === 2 ? "sub" : null);
      sec.appendChild(el("h2", null, s.title));
      const isLinks = /^(find me|links|contact|elsewhere)$/i.test(s.title.trim());
      let notes = null;
      for (const b of s.blocks){
        if (b.type === "note"){
          if (!notes){ notes = el("div", "notes"); sec.appendChild(notes); }
          notes.appendChild(renderNote(b));
        } else {
          notes = null;
        }
      }
      // paragraphs first (blurb / links), then post-its in document order
      const textHost = isLinks ? el("div", "links") : null;
      const frag = document.createDocumentFragment();
      for (const b of s.blocks){
        if (b.type !== "p") continue;
        const p = el("p", isLinks ? null : "blurb");
        renderRuns(p, b.runs);
        (textHost || frag).appendChild(p);
      }
      sec.insertBefore(textHost || frag, sec.children[1] || null);
      return sec;
    }

    function render(data){
      page.textContent = "";
      const header = el("header");
      const titleBox = el("div", "title-box");
      titleBox.appendChild(el("h1", null, data.title || "Bhakti Assar"));
      if (data.subtitle) titleBox.appendChild(el("p", "subtitle", data.subtitle));
      if (data.intro && data.intro.length){
        const intro = el("div", "intro");
        for (const runs of data.intro){ const p = el("p"); renderRuns(p, runs); intro.appendChild(p); }
        titleBox.appendChild(intro);
      }
      header.appendChild(titleBox);
      // the profile photo comes from the Google Doc (a picture or pic link above the first heading)
      if (data.avatar && data.avatar.src && safeUrl(data.avatar.src)){
        const av = el("div", "avatar");
        const img = el("img");
        img.src = safeUrl(data.avatar.src); img.alt = data.avatar.alt || "Bhakti";
        img.onerror = () => av.remove();
        av.appendChild(img);
        header.appendChild(av);
      }
      page.appendChild(header);
      for (const s of data.sections || []) page.appendChild(renderSection(s));
      document.title = (data.title || "Bhakti Assar").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }


    // Cross-stitch border in olive thread: every X is two crossing threads, a touch uneven like hand work.
    function sewStitches(){
      const svg = document.getElementById("stitches");
      const host = svg.parentElement;
      const W = host.clientWidth, H = host.clientHeight, inset = 26, step = 25;
      let seed = 5;
      const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const between = (a, b) => a + rnd() * (b - a);
      const f = n => n.toFixed(1);
      const THREAD = "#4b5a35", EDGE = "#2f3a20", LIGHT = "#8a9a62";
      const out = [];
      const thread = (ax, ay, bx, by, w) => {
        out.push(`<line x1="${f(ax + .8)}" y1="${f(ay + 1.6)}" x2="${f(bx + .8)}" y2="${f(by + 1.6)}" stroke="rgba(40,28,8,.28)" stroke-width="${f(w + .8)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${EDGE}" stroke-width="${f(w + .6)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${THREAD}" stroke-width="${f(w)}" stroke-linecap="round"/>`);
        out.push(`<line x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="${LIGHT}" stroke-width="1" stroke-linecap="round" opacity=".55" transform="translate(-.5,-.6)"/>`);
      };
      const cross = (cx, cy) => {
        const r = between(6.2, 7.8), j = () => between(-1.4, 1.4), w = between(3, 3.8);
        thread(cx - r + j(), cy - r + j(), cx + r + j(), cy + r + j(), w);   // first thread
        thread(cx + r + j(), cy - r + j(), cx - r + j(), cy + r + j(), w);   // second thread, over the first
      };
      const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
      const nx = Math.max(2, Math.round((x1 - x0) / step)), ny = Math.max(2, Math.round((y1 - y0) / step));
      for (let i = 0; i <= nx; i++){ const x = x0 + (x1 - x0) * i / nx; cross(x, y0 + between(-1, 1)); cross(x, y1 + between(-1, 1)); }
      for (let i = 1; i < ny; i++){ const y = y0 + (y1 - y0) * i / ny; cross(x0 + between(-1, 1), y); cross(x1 + between(-1, 1), y); }
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.innerHTML = out.join("");
    }
    // Hand-cut paper edge: the scissors wander, drift in and out, and change angle now and then.
    function cutPaper(){
      const host = document.getElementById("page");
      const W = host.clientWidth, H = host.clientHeight, MAX = 15;
      let seed = 23;
      const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      const between = (a, b) => a + rnd() * (b - a);
      const pts = [];
      const side = (len, place) => {
        let d = between(2, MAX - 2), t = 0;
        while (true){
          t += between(26, 120);
          if (t > len - 20) break;
          d = rnd() < .18 ? between(0, MAX) : Math.max(0, Math.min(MAX, d + between(-5, 5)));
          pts.push(place(t, d));
          if (rnd() < .22) pts.push(place(t + between(6, 16), Math.max(0, Math.min(MAX, d + between(-4, 4)))));  // little jog
        }
      };
      pts.push([between(0, 10), between(0, 12)]);                       // top-left corner
      side(W, (t, d) => [t, d]);
      pts.push([W - between(0, 10), between(0, 12)]);                   // top-right
      side(H, (t, d) => [W - d, t]);
      pts.push([W - between(0, 10), H - between(0, 12)]);               // bottom-right
      side(W, (t, d) => [W - t, H - d]);
      pts.push([between(0, 10), H - between(0, 12)]);                   // bottom-left
      side(H, (t, d) => [d, H - t]);
      host.style.clipPath = "polygon(" + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(", ") + ")";
    }
    const pageEl = document.getElementById("page");
    let sewTimer;
    new ResizeObserver(() => { clearTimeout(sewTimer); sewTimer = setTimeout(() => { cutPaper(); sewStitches(); }, 60); }).observe(pageEl);

    fetch("content.json?v=" + Date.now())
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => { document.getElementById("status").textContent = "the page got lost in the post — try refreshing"; });
  </script>
</body>
</html>
